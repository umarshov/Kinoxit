
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kino Xit — Фильмы</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{background:#191919;padding:22px 6%;border-bottom:2px solid #e50914}
.logo{font-size:30px;font-weight:bold;color:#e50914}
.logo span{color:white}
header p{color:#bbb;margin-bottom:0}
main{max-width:1200px;margin:auto;padding:25px 18px}
h1{font-size:30px}
.search{width:100%;padding:14px;border:1px solid #444;border-radius:8px;background:#202020;color:white;font-size:16px;margin:10px 0 20px}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.categories button{background:#252525;color:white;border:1px solid #444;padding:12px 18px;border-radius:8px;cursor:pointer}
.categories button:hover,.categories button.active{background:#e50914;border-color:#e50914}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#1c1c1c;border-radius:10px;overflow:hidden;border:1px solid #303030}
.poster{height:170px;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;font-size:23px;font-weight:bold;background:linear-gradient(135deg,#4b0808,#171717 70%)}
.card:nth-child(3n+2) .poster{background:linear-gradient(135deg,#173b50,#171717 75%)}
.card:nth-child(3n) .poster{background:linear-gradient(135deg,#514016,#171717 75%)}
.info{padding:15px}
.info h3{margin:0 0 10px;font-size:19px}
.meta{color:#e65a5a;font-size:13px}
.info p{color:#bbb;font-size:14px;line-height:1.5}
.tag{display:inline-block;background:#303030;padding:6px 9px;border-radius:5px;font-size:12px}
footer{text-align:center;padding:25px;color:#888;border-top:1px solid #333;margin-top:35px}
#empty{color:#bbb;display:none}
</style>
</head>
<body>
<header>
  <div class="logo">KINO <span>XIT</span></div>
  <p>Твой каталог кино — выбирай фильм и наслаждайся!</p>
</header>

<main>
  <h1>Каталог фильмов</h1>
  <input class="search" id="search" placeholder="🔎 Найти фильм по названию..." />

  <div class="categories">
    <button class="active" data-genre="Все">Все фильмы</button>
    <button data-genre="Боевик">Боевики</button>
    <button data-genre="Комедия">Комедии</button>
    <button data-genre="Криминал">Криминал</button>
    <button data-genre="Фантастика">Фантастика</button>
  </div>

  <div class="grid" id="movies"></div>
  <p id="empty">Фильмы не найдены. Попробуй другое название.</p>
</main>

<footer>© 2026 Kino Xit · Каталог фильмов</footer>

<script>
const films = [
 {title:"Джон Уик",year:2014,genre:"Боевик",desc:"Бывший наёмник возвращается к опасной жизни."},
 {title:"Форсаж 7",year:2015,genre:"Боевик",desc:"Команда гонщиков сталкивается с новым противником."},
 {title:"Безумный Макс: Дорога ярости",year:2015,genre:"Боевик",desc:"Погоня за свободой в постапокалиптическом мире."},

 {title:"Маска",year:1994,genre:"Комедия",desc:"Обычный человек находит волшебную маску."},
 {title:"Один дома",year:1990,genre:"Комедия",desc:"Мальчик защищает свой дом от грабителей."},
 {title:"Мистер Бин",year:1997,genre:"Комедия",desc:"Комические приключения знаменитого героя."},

 {title:"Крёстный отец",year:1972,genre:"Криминал",desc:"История влиятельной семьи и её криминального мира."},
 {title:"Отступники",year:2006,genre:"Криминал",desc:"Полицейский и преступник внедряются в чужие организации."},
 {title:"Лицо со шрамом",year:1983,genre:"Криминал",desc:"История взлёта и падения криминального авторитета."},

 {title:"Интерстеллар",year:2014,genre:"Фантастика",desc:"Путешествие за пределы Земли ради будущего человечества."},
 {title:"Аватар",year:2009,genre:"Фантастика",desc:"Приключение на далёкой планете Пандора."},
 {title:"Матрица",year:1999,genre:"Фантастика",desc:"Человек узнаёт неожиданную правду об окружающем мире."}
];

let selectedGenre = "Все";
const grid = document.getElementById("movies");
const search = document.getElementById("search");
const empty = document.getElementById("empty");

function renderMovies(){
  const query = search.value.trim().toLowerCase();
  const filtered = films.filter(f =>
    (selectedGenre === "Все" || f.genre === selectedGenre) &&
    f.title.toLowerCase().includes(query)
  );

  grid.innerHTML = filtered.map(f => `
    <article class="card">
      <div class="poster">${f.title}</div>
      <div class="info">
        <h3>${f.title}</h3>
        <div class="meta">${f.year} · ${f.genre}</div>
        <p>${f.desc}</p>
        <span class="tag">${f.genre}</span>
      </div>
    </article>
  `).join("");

  empty.style.display = filtered.length ? "none" : "block";
}

document.querySelectorAll(".categories button").forEach(button => {
  button.addEventListener("click", () => {
    selectedGenre = button.dataset.genre;
    document.querySelectorAll(".categories button")
      .forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    renderMovies();
  });
});

search.addEventListener("input", renderMovies);
renderMovies();
</script>
</body>
</html>
